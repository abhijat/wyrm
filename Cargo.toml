[package]
name = "wyrm"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/abhijat/wyrm"

[dependencies]
anyhow = "1.0.104"
redis = { version = "1.8.1", features = ["tokio-comp", "connection-manager"] }
rmcp = { version = "3.8.0", features = ["server", "macros", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
reqwest = "0.13.5"
prometheus-parse = "0.2.5"
